<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070B18">
<title>Unlock the trip plan</title>
<style>
:root{--bg:#070B18;--card:#161E33;--ink:#F3EFE4;--muted:#D7E3F4;--gold:#FDE68A;--red:#7f1d1d;--line:rgba(253,230,138,.35)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--ink)}
html[data-theme="day"]{--bg:#0b2a1f;--card:#fff;--ink:#1E293B;--muted:#475569;--gold:#A16207;--line:rgba(212,160,23,.45)}
html[data-theme="day"] body{background:linear-gradient(180deg,#0b2a1f 0,#14532d 240px,#0b2a1f 100%);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
 background:linear-gradient(180deg,#070B18 0,#10182E 240px,#0C1224 100%);-webkit-text-size-adjust:100%}
html[data-theme="day"] body{background:linear-gradient(180deg,#0b2a1f 0,#14532d 240px,#0b2a1f 100%)}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
html[data-theme="day"] #stars{display:none}
#stars::before{content:"";position:absolute;inset:0;box-shadow:8vw 12vh 1px 1px rgba(255,248,220,.8),22vw 40vh 1.5px 1.5px rgba(255,248,220,.6),71vw 18vh 1px 1px rgba(255,248,220,.9),88vw 62vh 2px 2px rgba(255,248,220,.5),40vw 78vh 1px 1px rgba(255,248,220,.7),55vw 8vh 1px 1px rgba(255,248,220,.55),15vw 88vh 1.5px 1.5px rgba(255,248,220,.65),93vw 30vh 1px 1px rgba(255,248,220,.8)}
.card{position:relative;z-index:1;width:100%;max-width:400px;background:var(--card);border-radius:22px;padding:28px 24px 26px;text-align:center;
  box-shadow:0 12px 40px rgba(0,0,0,.45),0 0 0 1px var(--line),0 0 28px rgba(212,160,23,.1)}
html[data-theme="day"] .card{box-shadow:0 12px 32px rgba(0,0,0,.25)}
.lights{font-size:22px;letter-spacing:6px;margin-bottom:8px}
h1{margin:0 0 6px;font-size:1.45rem;line-height:1.25;color:var(--gold)}
p.lead{margin:0 0 20px;font-size:15px;color:var(--muted);line-height:1.45}
form{display:flex;flex-direction:column;gap:12px}
label{position:absolute;left:-9999px}
input[type=password]{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:rgba(0,0,0,.28);color:var(--ink);font-size:16px;outline:none}
html[data-theme="day"] input[type=password]{background:#F8FAFC;color:#1E293B}
input[type=password]:focus{box-shadow:0 0 0 3px rgba(253,230,138,.35)}
button.unlock{appearance:none;border:0;border-radius:999px;padding:12px 18px;font-weight:800;font-size:15px;letter-spacing:.02em;cursor:pointer;color:#FDE68A;
  background:linear-gradient(135deg,#991b1b,#7f1d1d);box-shadow:0 2px 0 #5c1010}
button.unlock:hover{filter:brightness(1.06)}
button.unlock:disabled{opacity:.7;cursor:default}
.err{min-height:1.3em;margin:10px 0 0;font-size:13.5px;font-weight:650;color:#FECACA}
html[data-theme="day"] .err{color:#9F0E24}
.ok{margin:0;font-size:15px;color:var(--muted)}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){#stars::before{box-shadow:none}}
</style>
<script>
(function themeBoot(){
  var p='auto';
  try{ p=localStorage.getItem('disney-theme-pref')||'auto'; }catch(e){}
  function etMinutes(){
    var parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',hourCycle:'h23',hour12:false}).formatToParts(new Date());
    var o={}; parts.forEach(function(x){ if(x.type!=='literal') o[x.type]=x.value; });
    var h=parseInt(o.hour,10); if(h===24) h=0;
    var dp=String(o.dayPeriod||'').toLowerCase().replace(/\./g,'');
    if(dp==='pm'&&h<12) h+=12;
    if(dp==='am'&&h===12) h=0;
    return (isNaN(h)?0:h)*60+(parseInt(o.minute,10)||0);
  }
  var theme=p==='day'?'day':'night';
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
</head>

<div class="card">

  <p class="lead" id="lead">Enter the passphrase to open the plan.</p>

  <form id="gate" autocomplete="off">
    <label for="pass">Passphrase</label>
    <input id="pass" type="password" name="pass" autocomplete="current-password" required autofocus>
    <button class="unlock" type="submit" id="go">Unlock</button>
  </form>
  <p class="err" id="err" role="alert"></p>
</div>

const LS_KEY = 'disney-gate-key';
const LS_ID = 'disney-gate-id';
const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const enc = new TextEncoder();
const dec = new TextDecoder();

async function deriveKey(pass, salt){
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:GATE.iter, hash:'SHA-256'},
    base,
    {name:'AES-GCM', length:256},
    true,
    ['decrypt']
  );
}
async function importRaw(b64key){
  return crypto.subtle.importKey('raw', b64(b64key), {name:'AES-GCM'}, true, ['decrypt']);
}
async function exportRaw(key){
  const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
  let s=''; for (const n of raw) s += String.fromCharCode(n);
  return btoa(s);
}
async function decryptWith(key){
  const iv = b64(GATE.iv), ct = b64(GATE.ct);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return dec.decode(pt);
}
function enter(html){
  document.open();
  document.write(html);
  document.close();
}
function showOpening(){
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('lead').classList.add('hidden');
  document.getElementById('opening').classList.remove('hidden');
  document.getElementById('err').textContent = '';
}
function showForm(){
  document.getElementById('gate').classList.remove('hidden');
  document.getElementById('lead').classList.remove('hidden');
  document.getElementById('opening').classList.add('hidden');
}

async function tryStored(){
  let raw, id;
  try{ raw=localStorage.getItem(LS_KEY); id=localStorage.getItem(LS_ID); }catch(e){ return false; }
  if(!raw || id !== GATE.salt) return false;
  try{
    const html = await decryptWith(await importRaw(raw));
    enter(html);
    return true;
  }catch(e){
    try{ localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_ID); }catch(x){}
    return false;
  }
}

async function unlock(pass){
  const key = await deriveKey(pass, b64(GATE.salt));
  const html = await decryptWith(key);
  try{
    localStorage.setItem(LS_KEY, await exportRaw(key));
    localStorage.setItem(LS_ID, GATE.salt);
  }catch(e){}
  enter(html);
}

(async function boot(){
  if(await tryStored()) return;
  const form=document.getElementById('gate');
  const err=document.getElementById('err');
  const go=document.getElementById('go');
  form.addEventListener('submit', async function(e){
    e.preventDefault();
    err.textContent='';
    const pass=document.getElementById('pass').value;
    if(!pass){ err.textContent='Please enter the passphrase.'; return; }
    go.disabled=true;
    showOpening();
    try{
      await unlock(pass);
    }catch(ex){
      showForm();
      err.textContent="That passphrase didn't work. Try again?";
      go.disabled=false;
      document.getElementById('pass').focus();
      document.getElementById('pass').select();
    }
  });
})();
</script>
