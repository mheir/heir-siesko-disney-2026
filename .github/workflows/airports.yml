name: Refresh airport status

# Copies the FAA's nationwide airport status list (ground stops, ground delay
# programs, arrival and departure delays, closures) into airports.json so the
# trip page can show it, with a 72-hour history of nationwide counts for the
# trend line. No key or account needed.
#
# GitHub's cron schedule turned out to be unreliable here (it never fired), so
# each run stays up for about 5h40m, checking the FAA every 10 minutes, and then
# starts the next run itself. The cron line stays only as a backup to restart the
# chain if it ever breaks. The page calls the list stale after 30 minutes, so a
# fresh copy is committed whenever it changes or at least every 20 minutes.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/airports.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: airports
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Stop after the trip
        id: window
        run: |
          if [ "${{ github.event_name }}" != "push" ] && [ "$(date -u +%Y%m%d)" -gt 20261201 ]; then
            echo "Trip is over; nothing to do."; echo "go=no" >> "$GITHUB_OUTPUT"
          else echo "go=yes" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.window.outputs.go == 'yes'

      - uses: actions/setup-node@v4
        if: steps.window.outputs.go == 'yes'
        with:
          node-version: '20'

      - name: Write the FAA fetch script
        if: steps.window.outputs.go == 'yes'
        run: |
          cat > /tmp/faa.mjs <<'EOF'
          import fs from 'node:fs';
          const FILE = 'airports.json';
          const tx = s => s.replace(/\s+/g, ' ').trim();
          function parseFAA(xml) {
            const ev = [];
            const up = (xml.match(/<Update_Time>([^<]*)<\/Update_Time>/) || [])[1] || '';
            for (const blk of xml.match(/<Delay_type>[\s\S]*?<\/Delay_type>/g) || []) {
              const name = tx((blk.match(/<Name>([^<]*)<\/Name>/) || [])[1] || '');
              const re = /<(\w+)(?:\s[^>]*)?>\s*<ARPT>([^<]*)<\/ARPT>([\s\S]*?)<\/\1>/g; let m;
              while ((m = re.exec(blk))) {
                const base = { type: name, arpt: tx(m[2]).toUpperCase() }; const body = m[3];
                const leaf = s => { const o = {}; s.replace(/<(\w+)(?:\s[^>]*)?>([^<]*)<\/\1>/g, (_, k, v) => { if (tx(v)) o[k] = tx(v); return ''; }); return o; };
                const AD = /<Arrival_Departure\b[^>]*>[\s\S]*?<\/Arrival_Departure>/g;
                const ads = body.match(AD); const rest = leaf(body.replace(AD, ''));
                if (ads) for (const a of ads) ev.push({ ...base, ...rest, dir: (a.match(/Type="([^"]*)"/) || [])[1] || '', ...leaf(a) });
                else ev.push({ ...base, ...rest });
              }
            }
            return { faa_updated: up, events: ev };
          }
          let prev = null; try { prev = JSON.parse(fs.readFileSync(FILE, 'utf8')); } catch {}
          let out;
          try {
            const r = await fetch('https://nasstatus.faa.gov/api/airport-status-information', { headers: { accept: 'application/xml', origin: 'https://mheir.github.io' }, signal: AbortSignal.timeout(30000) });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const xml = await r.text();
            if (!/AIRPORT_STATUS_INFORMATION/.test(xml)) throw new Error('unexpected response');
            out = { ok: true, source: 'https://nasstatus.faa.gov/api/airport-status-information', checked: new Date().toISOString(), browser_ok: r.headers.get('access-control-allow-origin') || '', ...parseFAA(xml) };
          } catch (e) {
            console.log('FAA fetch failed:', e.message);
            if (prev && prev.ok) { console.log('Keeping the last good list.'); process.exit(0); }
            out = { ok: false, checked: new Date().toISOString(), error: String(e.message).slice(0, 120), events: [], history: (prev && prev.history) || [] };
          }
          const same = prev && prev.ok === out.ok && prev.browser_ok === out.browser_ok && JSON.stringify(prev.events) === JSON.stringify(out.events);
          const age = prev && prev.checked ? Date.now() - Date.parse(prev.checked) : Infinity;
          if (same && age < 18 * 60000) { console.log('No change.'); process.exit(0); }
          // Nationwide trend: how many airports have ground stops, ground delay programs or delays.
          const kind = t => /ground stop/i.test(t) ? 'gs' : /ground delay/i.test(t) ? 'gdp' : /arrival|departure/i.test(t) ? 'dl' : '';
          const sets = { gs: new Set(), gdp: new Set(), dl: new Set() };
          for (const x of out.events) { const k = kind(x.type); if (k) sets[k].add(x.arpt); }
          const cutoff = Date.now() - 72 * 3600000;
          const history = ((prev && prev.history) || []).filter(h => Date.parse(h.t) > cutoff);
          if (out.ok) history.push({ t: out.checked, gs: sets.gs.size, gdp: sets.gdp.size, dl: sets.dl.size });
          out.history = history;
          fs.writeFileSync(FILE, JSON.stringify(out) + '\n');
          console.log('Wrote', out.events.length, 'events');
          EOF

      - name: Refresh every 10 minutes for about 5h40m
        if: steps.window.outputs.go == 'yes'
        run: |
          git config user.name "Disney Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 340*60 ))
          while :; do
            git pull -q --rebase origin main || echo "pull failed; using the local copy"
            node /tmp/faa.mjs || echo "fetch script failed"
            git add airports.json 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -q -m "Update airport status"
              for i in 1 2 3 4; do
                git pull -q --rebase origin main && git push -q origin HEAD:main && break
                sleep $((i*5))
              done
            else
              echo "Nothing to commit"
            fi
            [ $(( $(date +%s) + 600 )) -ge $end ] && break
            sleep 600
          done

      - name: Start the next run
        if: ${{ !cancelled() && steps.window.outputs.go == 'yes' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run airports.yml --repo "${{ github.repository }}" --ref main
